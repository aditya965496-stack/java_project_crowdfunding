# ==========================================
# Application Configuration
# ==========================================
spring.application.name=CrowdFund Platform

# ==========================================
# Database Connection (Secrets Hidden / Env Overridable)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/crowdfund;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# ==========================================
# Vaadin & Network Resilience
# ==========================================
vaadin.launch-browser=false
vaadin.allowed-packages=com.crowdfund
vaadin.heartbeatInterval=30
vaadin.closeIdleSessions=true
vaadin.copilot.enable=false
vaadin.copilot.enabled=false
vaadin.devmode.copilot.enabled=false
vaadin.devTools.enabled=false
vaadin.reconnectDialog.dialogText=Connection lost to server. Reconnecting...
vaadin.reconnectDialog.dialogTextGaveUp=Server connection could not be re-established. Please refresh the page.

# ==========================================
# Server & Error Masking (Hide Sensitive Errors)
# ==========================================
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ==========================================
# Logging (No Debug Leaks)
# ==========================================
logging.level.root=WARN
logging.level.com.crowdfund=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ==========================================
# Application Security & Payment Configuration
# ==========================================
crowdfund.security.admin.email=${ADMIN_EMAIL:admin@crowdfund.com}
crowdfund.security.admin.password=${ADMIN_PASSWORD:admin123}
crowdfund.payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:sec_live_9b4e2f1807d84a56c0e3952f1a67d0}
crowdfund.payment.api-key=${PAYMENT_API_KEY:mock_sk_live_crowdfund_key}
crowdfund.seed.demo-data=${SEED_DEMO_DATA:false}
crowdfund.upload.dir=${UPLOAD_DIR:./uploads}
crowdfund.upload.max-size-bytes=5242880
crowdfund.ratelimit.enabled=true
crowdfund.ratelimit.requests-per-minute=60
