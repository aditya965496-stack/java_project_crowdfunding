# ==========================================
# MySQL Production Profile (Secrets Hidden)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crowdfund?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=false&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:crowdfund_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
